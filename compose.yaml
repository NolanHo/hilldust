name: hillstone-vpn

services:
  vpn:
    build:
      context: .
    image: hillstone-vpn:5.7.1
    container_name: hillstone-vpn
    restart: unless-stopped

    # Own network namespace: hilldust's routing and DNS changes stay inside
    # the container, and are reverted by deleting the namespace. Never use
    # network_mode: host here -- that is the failure mode this exists to
    # avoid.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

    env_file:
      - secret.env          # HILLSTONE_SERVER / _USER / _PASSWORD

    ports:
      # loopback only -- reach it from another machine with an SSH forward:
      #   ssh -N -L 1080:127.0.0.1:1080 <host>
      - "127.0.0.1:1080:1080"

    healthcheck:
      # The 0.0.0.0/1 split route exists only while a session is up.
      test: ["CMD-SHELL", "ip route show 0.0.0.0/1 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
