name: hillstone-vpn

services:
  vpn:
    build:
      context: .
    image: hillstone-vpn:5.7.1
    container_name: hillstone-vpn
    restart: unless-stopped

    # Own network namespace: hilldust's routing and DNS changes stay inside
    # the container, and are reverted by deleting the namespace. Never use
    # network_mode: host here -- that is the failure mode this exists to
    # avoid.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun

    env_file:
      - secret.env          # HILLSTONE_SERVER / _USER / _PASSWORD

    ports:
      # HILLSTONE_BIND defaults to loopback: nothing outside this host can
      # reach the tunnel. Set it to a LAN address (in an untracked .env) to
      # let other machines use the proxy directly -- but note that anyone on
      # that network then has your VPN exit, unauthenticated.
      - "${HILLSTONE_BIND:-127.0.0.1}:1080:1080"

    healthcheck:
      # Both halves matter: the /1 route exists only while a session is up,
      # and the listener is what actually answers. Checking the route alone
      # reports healthy while the proxy is dead.
      test: ["CMD-SHELL", "ip route show 0.0.0.0/1 2>/dev/null | grep -q . && ss -tln 2>/dev/null | grep -q ':1080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
